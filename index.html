<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolate Analyzer Saga</title>
    <link rel="stylesheet" href="beautiful.css">
</head>

<body>
    <h1 class="main-heading">Analyze Your Favorite Chocolate</h1>

    <div class="input-area">
        <label for="chocolate-name">Enter Chocolate Name:</label>
        <input type="text" placeholder="chocolate name" id="chocolate-name" required>
    </div>

    <div class="button">
        <button class="start-button" id="main-button">Analyze</button>
    </div>

    <div class="loading-message" id="LoadingMessage"></div>

    <div class="redBox">
        <div id="roastBox"></div>
    </div>
    <script src="hero.js"></script>


</body>

</html>
